    <!-- Meta Pixel & Conversions API Script -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');

      // ID do Pixel do Facebook (Substitua facilmente aqui pelo seu ID do Gerenciador de Anúncios)
      window.FB_PIXEL_ID = window.FB_PIXEL_ID || '1234567890123456';

      fbq('init', window.FB_PIXEL_ID);
      fbq('track', 'PageView');

      // Função de disparo para cliques no Checkout (InitiateCheckout) com EventID para deduplicação com a API de Conversões
      window.trackInitiateCheckout = function(productName, value) {
        if (typeof window.fbq === 'function') {
          var eventId = 'init_checkout_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
          window.fbq('track', 'InitiateCheckout', {
            content_name: productName || 'Combo 100 Esboços de Pregação',
            content_category: 'E-book Ministerial',
            value: typeof value === 'number' ? value : 19.99,
            currency: 'BRL',
            num_items: 1
          }, { eventID: eventId });
          console.log('[Meta Pixel] Evento InitiateCheckout enviado com sucesso:', productName, 'R$', value, 'EventID:', eventId);
        }
      };

      // Rastreamento automático de cliques em links de checkout da Kiwify
      document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('click', function(e) {
          var target = e.target.closest('a');
          if (target && target.href && (target.href.indexOf('pay.kiwify.com.br') !== -1 || target.dataset.trackCheckout)) {
            var prodName = target.dataset.productName || target.innerText || 'Combo 100 Esboços';
            var prodVal = parseFloat(target.dataset.productValue) || 19.99;
            window.trackInitiateCheckout(prodName.trim(), prodVal);
          }
        });
      });
    </script>
    <!-- End Meta Pixel Code (Script) -->
